<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои счета</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="/static/js/token.js" defer></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="user-info">
                <div class="avatar" id="userAvatar"></div>
                <h3 id="username">Пользователь</h3>
            </div>
            <nav class="menu">
                <ul>
                    <li class="active"><a href="accounts"><i class="icon-account"></i> Счета</a></li>
                    <li><a href="payments"><i class="icon-payment"></i> Платежи</a></li>
                    <li><a href="profile"><i class="icon-profile"></i> Профиль</a></li>
                    <li><a href="#" id="logout-btn"><i class="icon-logout"></i> Выйти</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <h1>Мои счета</h1>
            
            <div class="actions">
                <button id="create-account-btn">Создать новый счет</button>
            </div>
            
            <div class="modal hidden" id="create-account-modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Создание нового счета</h2>
                    <form id="create-account-form">
                        <div class="form-group">
                            <label for="account-name">Название счета</label>
                            <input type="text" id="account-name" required>
                        </div>
                        <div class="form-group">
                            <label for="account-currency">Валюта</label>
                            <select id="account-currency" required>
                                <option value="USD">Доллар (USD)</option>
                                <option value="EUR">Евро (EUR)</option>
                                <option value="RUB">Рубль (RUB)</option>
                            </select>
                        </div>
                        <button type="submit">Создать</button>
                    </form>
                </div>
            </div>
            
            <div class="accounts-list" id="accounts-list">
                <!-- Счета будут загружены сюда -->
                <div class="loading">Загрузка счетов...</div>
            </div>
        </main>
    </div>
    <div class="modal hidden" id="history-modal">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close" id="close-history">&times;</span>
            <h2>История операций</h2>
            <div class="history-container" id="history-container">
                <!-- История операций будет загружена сюда -->
            </div>
            <div class="pagination">
                <button id="prev-page" disabled>Назад</button>
                <span id="page-info">Страница 1</span>
                <button id="next-page">Вперед</button>
            </div>
        </div>
    </div>

    <script src="../static/js/user.js"></script>
    <script src="../static/js/accounts.js"></script>
</body>
</html>
