<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="/static/js/token.js" defer></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="user-info">
                <div class="avatar"></div>
                <h3 id="username">Пользователь</h3>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="accounts"><i class="icon-account"></i> Счета</a></li>
                    <li><a href="payments"><i class="icon-payment"></i> Платежи</a></li>
                    <li class="active"><a href="profile"><i class="icon-profile"></i> Профиль</a></li>
                    <li><a href="#" id="logout-btn"><i class="icon-logout"></i> Выйти</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <h1>Профиль</h1>
            
            <div class="profile-info">
                <div class="profile-field">
                    <span class="field-label">Имя:</span>
                    <span class="field-value" id="profile-name">Загрузка...</span>
                    <button class="edit-btn" data-field="name">Изменить</button>
                </div>
                <div class="profile-field">
                    <span class="field-label">Email:</span>
                    <span class="field-value" id="profile-email">Загрузка...</span>
                    <button class="edit-btn" data-field="email">Изменить</button>
                </div>
                <div class="profile-field">
                    <span class="field-label">Пароль:</span>
                    <span class="field-value">********</span>
                    <button class="edit-btn" data-field="password">Изменить</button>
                </div>
            </div>
            
            <!-- Модальные окна для редактирования -->
            <div class="modal hidden" id="edit-name-modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Изменение имени</h2>
                    <form id="edit-name-form">
                        <div class="form-group">
                            <label for="new-name">Новое имя</label>
                            <input type="text" id="new-name" required>
                        </div>
                        <button type="submit">Сохранить</button>
                    </form>
                </div>
            </div>
            
            <div class="modal hidden" id="edit-email-modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Изменение email</h2>
                    <form id="edit-email-form">
                        <div class="form-group">
                            <label for="new-email">Новый email</label>
                            <input type="email" id="new-email" required>
                        </div>
                        <button type="submit">Сохранить</button>
                    </form>
                </div>
            </div>
            
            <div class="modal hidden" id="edit-password-modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Изменение пароля</h2>
                    <form id="edit-password-form">
                        <div class="form-group">
                            <label for="current-password">Текущий пароль</label>
                            <input type="password" id="current-password" required>
                        </div>
                        <div class="form-group">
                            <label for="new-password">Новый пароль</label>
                            <input type="password" id="new-password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Подтвердите новый пароль</label>
                            <input type="password" id="confirm-password" required>
                        </div>
                        <button type="submit">Сохранить</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../static/js/user.js"></script>
    <script src="../static/js/profile.js"></script>
</body>
</html>
