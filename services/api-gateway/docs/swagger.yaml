basePath: /
definitions:
  models.AssignPermissionRequest:
    properties:
      permissionID:
        type: string
      relationType:
        type: string
    type: object
  models.BalanceOperation:
    properties:
      account_id:
        type: string
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      new_balance:
        type: number
      operation_id:
        type: string
      operation_type:
        type: string
      transaction_id:
        type: string
      processed_at:
        type: string
      status:
        type: string
    type: object
  models.CheckPermissionRequest:
    properties:
      object_id:
        type: string
      permission_name:
        type: string
      subject_id:
        type: string
    required:
    - object_id
    - permission_name
    - subject_id
    type: object
  models.CheckPermissionResponse:
    properties:
      has_permission:
        type: boolean
    type: object
  models.ConvertCurrencyResponse:
    properties:
      operation_id:
        type: string
    type: object
  models.CreateAccountResponse:
    properties:
      account_id:
        type: string
    type: object
  models.CreateRelationRequest:
    properties:
      relationType:
        type: string
      sourceID:
        type: string
      targetID:
        type: string
    type: object
  models.CurrencyAccount:
    properties:
      account_name:
        type: string
      balance:
        type: number
      blocked_amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.CurrencyRateResponse:
    properties:
      from_currency:
        type: string
      rate:
        type: number
      to_currency:
        type: string
    type: object
  models.DeleteRelationRequest:
    properties:
      relationType:
        type: string
      sourceID:
        type: string
      targetID:
        type: string
    type: object
  models.DepositResponse:
    properties:
      transaction_id:
        type: string
    type: object
  models.Entity:
    properties:
      createdAt:
        type: string
      id:
        type: string
      type:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.GetBalanceResponse:
    properties:
      balance:
        type: number
    type: object
  models.Transaction:
    properties:
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      receiver:
        type: string
      sender:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  models.Permission:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Relation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      relationType:
        type: string
      sourceID:
        type: string
      targetID:
        type: string
    type: object
  models.RevokePermissionRequest:
    properties:
      permissionID:
        type: string
      relationType:
        type: string
    type: object
  models.Session:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      refresh_token_hash:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
      user_ip:
        type: string
    type: object
  models.UpdateCurrencyRateRequest:
    properties:
      from_currency:
        type: string
      rate:
        type: number
      to_currency:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  models.UserRoleResponse:
    properties:
      role:
        type: string
    type: object
  models.UserSession:
    properties:
      AccessToken:
        type: string
      RefreshToken:
        type: string
    type: object
host: localhost
info:
  contact: {}
  description: API для платежной системы
  title: Transaction API
  version: "1.0"
paths:
  /account/{account_id}:
    get:
      description: Возвращает информацию о счете по его ID
      parameters:
      - description: Номер счета
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CurrencyAccount'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить информацию о счете
      tags:
      - account
  /account/{account_id}/balance:
    get:
      description: Возвращает баланс счета по номеру счета
      parameters:
      - description: Номер счета
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GetBalanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить баланс
      tags:
      - account
  /account/create:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Создает новый счет с указанной валютой и именем
      parameters:
      - description: Валюта
        enum:
        - USD
        - EUR
        - RUB
        in: formData
        name: currency
        required: true
        type: string
      - description: Имя счета
        in: formData
        name: account_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать счет
      tags:
      - account
  /account/get:
    get:
      description: Возвращает список всех счетов текущего пользователя
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CurrencyAccount'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить список счетов пользователя
      tags:
      - account
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Валидирует входные данные и создаёт сессию(сохраняет токены в cookies)
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Войти используя данные пользователя
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Удаляет текущую сессию(добавляет токен в Blacklist до истечения
        его срока жизни, удаляет данные о сессии из базы данных)
      parameters:
      - description: ID пользователя
        in: query
        name: userID
        type: string
      - description: ID сессии
        in: query
        name: sessionID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Выйти из текущей сессии
      tags:
      - auth
  /auth/logout-all:
    post:
      consumes:
      - application/json
      description: Удаляет все сессии текущего пользователя
      parameters:
      - description: ID пользователя
        in: query
        name: userID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Выйти со всех устройств
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет сессию(токены), для получения нового, не просроченного
        Access токена
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Обновить сессию
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Регистрирует нового пользователя и создаёт для него сессию(сохраняет
        токены в cookies)
      parameters:
      - description: User name
        in: formData
        name: name
        required: true
        type: string
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Зарегистрировать нового пользователя
      tags:
      - auth
  /auth/sessions:
    get:
      consumes:
      - application/json
      description: Возвращает все сессии пользователя
      parameters:
      - description: ID пользователя
        in: query
        name: userID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Session'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Получить все сессии пользователя
      tags:
      - auth
  /transactions/{transactionID}:
    get:
      description: Возвращает информацию о конкретном платеже
      parameters:
      - description: ID платежа
        in: path
        name: transactionID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить платеж
      tags:
      - transactions
  /transactions/{transactionID}/cancel:
    patch:
      description: Отменяет указанный платеж
      parameters:
      - description: ID платежа
        in: path
        name: transactionID
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отменить платеж
      tags:
      - transactions
  /transactions/{transactionID}/update:
    patch:
      consumes:
      - application/x-www-form-urlencoded
      description: Обновляет статус указанного платежа
      parameters:
      - description: ID платежа
        in: path
        name: transactionID
        required: true
        type: string
      - description: Статус
        enum:
        - completed
        - refunded
        in: formData
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить статус платежа
      tags:
      - transactions
  /transactions/convert:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Конвертирует указанную сумму из одной валюты в другую
      parameters:
      - description: Номер счёта с валютой для обмена
        in: formData
        name: sender
        required: true
        type: string
      - description: Номер счёта для зачисления новой валюты
        in: formData
        name: receiver
        required: true
        type: string
      - description: Сумма платежа
        in: formData
        name: amount
        required: true
        type: number
      - description: Описание платежа
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ConvertCurrencyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Конвертировать валюту
      tags:
      - transactions
  /transactions/currency-rate:
    post:
      consumes:
      - application/json
      description: Обновляет курс конвертации между валютами (Admin only)
      parameters:
      - description: Данные для обновления курса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateCurrencyRateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить курс валют
      tags:
      - transactions
  /transactions/currency-rate/get:
    get:
      description: Возвращает текущий курс обмена между указанными валютами
      parameters:
      - description: 'Исходная валюта (например: USD)'
        in: query
        name: from
        required: true
        type: string
      - description: 'Целевая валюта (например: EUR)'
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CurrencyRateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить курс валют
      tags:
      - transactions
  /transactions/deposit:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Пополняет счет на указанную сумму
      parameters:
      - description: Номер счета
        in: formData
        name: account_id
        required: true
        type: string
      - description: Сумма платежа
        in: formData
        name: amount
        required: true
        type: number
      - description: Описание платежа
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DepositResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Пополнить счет
      tags:
      - transactions
  /transactions/get:
    get:
      description: Возвращает список всех платежей
      parameters:
      - description: ID пользователя
        in: query
        name: userID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Transaction'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить все платежи
      tags:
      - transactions
  /transactions/history:
    get:
      description: Возвращает историю операций по указанному счету
      parameters:
      - description: Номер счета
        in: query
        name: account_id
        required: true
        type: string
      - description: Лимит (по умолчанию 10)
        in: query
        name: limit
        type: integer
      - description: Смещение (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BalanceOperation'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить историю операций
      tags:
      - transactions
  /transactions/transfer:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Создаеёт перевод между указанными счетами
      parameters:
      - description: Платёжный счет
        in: formData
        name: sender
        required: true
        type: string
      - description: Номер счета получателя
        in: formData
        name: receiver
        required: true
        type: string
      - description: Сумма платежа
        in: formData
        name: amount
        required: true
        type: number
      - description: Валюта
        enum:
        - USD
        - EUR
        - RUB
        in: formData
        name: currency
        required: true
        type: string
      - description: Описание платежа
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Transaction'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Перевести на другой счет
      tags:
      - transactions
  /role/entities:
    get:
      description: Возвращает список всех сущностей (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Entity'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить все сущности
      tags:
      - role
  /role/permissions:
    get:
      description: Возвращает список всех доступных разрешений (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Permission'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить все разрешения
      tags:
      - role
  /role/permissions/assign:
    post:
      consumes:
      - application/json
      description: Назначает разрешение для указанного типа связи (Admin only)
      parameters:
      - description: Данные разрешения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AssignPermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Назначить разрешение
      tags:
      - role
  /role/permissions/check:
    post:
      consumes:
      - application/json
